name: tests

on:
  # A pull request is tested once, by pull_request; a push is tested on
  # master only (a branch's push would run the same tests a second time).
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    # Four processes at once (scripts/test-parallel.py): about 3 minutes on
    # SQLite and 4 on PostgreSQL, where one process took 17 to 30.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A lab server runs on PostgreSQL, a laptop or the desktop app on
        # SQLite; the same suite has to pass on both.
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biomanager
          POSTGRES_PASSWORD: biomanager
          POSTGRES_DB: biomanager_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U biomanager"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BIOMANAGER_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://biomanager:biomanager@localhost:5432/biomanager_test' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        # pywebview is only for the desktop build and needs GUI libraries
        # that the Linux runner does not have; the tests never import it.
        run: |
          grep -v pywebview requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt
      - name: Run the tests
        env:
          # Words the maintainers keep out of what ships (tests/test_deploy.py); a secret, so
          # this public repository never lists them. Empty on forks: that check is skipped.
          BIOMANAGER_PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}
        run: python scripts/test-parallel.py -j 4
