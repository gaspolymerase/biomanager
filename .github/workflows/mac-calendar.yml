name: Mac Calendar

# Calendar → Mac Calendar (app/mac_calendar.py) against the Mac's real
# calendars, which tests/test_mac_calendar.py replaces with a stand-in: on
# GitHub's Macs, in three time zones, whenever the code it uses changes.
# The release workflow also turns it on in each built Mac app.

on:
  pull_request:
    paths:
      - app/mac_calendar.py
      - app/lab_calendar.py
      - scripts/mac-calendar-check/**
      - requirements.txt
      - .github/workflows/mac-calendar.yml
  push:
    branches: [master, claude/exciting-pasteur-1t2m27]   # TEMPORARY
    paths:
      - app/mac_calendar.py
      - app/lab_calendar.py
      - scripts/mac-calendar-check/**
      - requirements.txt
      - .github/workflows/mac-calendar.yml
  workflow_dispatch:

jobs:
  eventkit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # As if someone clicked Allow: for Python and whatever runs this step.
      - name: Let this Mac's Python use the calendars
        run: |
          PY=$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')
          sudo /usr/bin/python3 scripts/mac-calendar-check/grant.py "$PY" $(scripts/mac-calendar-check/chain.sh) /bin/bash
      - name: Los Angeles
        env: { TZ: America/Los_Angeles }
        run: python scripts/mac-calendar-check/live.py
      - name: Shanghai
        if: ${{ !cancelled() }}
        env: { TZ: Asia/Shanghai }
        run: python scripts/mac-calendar-check/live.py TheStore
      - name: UTC
        if: ${{ !cancelled() }}
        env: { TZ: UTC }
        run: python scripts/mac-calendar-check/live.py TheStore

  # TEMPORARY: the release workflow's "Check the Mac Calendar" step, run
  # as written there, on an app built from this branch.
  built-app:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt pyinstaller pyyaml
      - run: BIOMANAGER_VERSION=2.3.1 ./scripts/build-desktop.sh
      - name: The release workflow's step, as written there
        run: |
          python - <<'PY'
          import yaml, os
          steps = yaml.safe_load(open(".github/workflows/release.yml"))["jobs"]["desktop"]["steps"]
          step = next(s for s in steps if s.get("name") == "Check the Mac Calendar")
          with open("step.sh", "w") as f:
              for k, v in step["env"].items():
                  v = str(v).replace("$" + "{{ runner.temp }}", os.environ["RUNNER_TEMP"])
                  f.write(f'export {k}="{v}"\n')
              f.write(step["run"])
          PY
          cat step.sh
          bash -e step.sh

  # TEMPORARY: the clocks-change round trip, the Mac set to Los Angeles.
  experiment:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          PY=$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')
          sudo /usr/bin/python3 scripts/mac-calendar-check/grant.py "$PY" $(scripts/mac-calendar-check/chain.sh) /bin/bash
      - name: TZ for this program only (the Mac on UTC)
        env: { TZ: America/Los_Angeles }
        run: python scripts/mac-calendar-check/_experiment.py
      - name: The whole Mac in Los Angeles
        if: ${{ !cancelled() }}
        run: |
          sudo systemsetup -settimezone America/Los_Angeles || sudo ln -sf /usr/share/zoneinfo/America/Los_Angeles /etc/localtime
          sleep 3
          python scripts/mac-calendar-check/_experiment.py
      - name: live.py, the whole Mac in Los Angeles
        if: ${{ !cancelled() }}
        run: python scripts/mac-calendar-check/live.py
