name: release

# Push a version tag (git tag v0.2.0 && git push origin v0.2.0) and this
# builds BioManager for macOS (Apple silicon and Intel), Windows, Linux and
# Android, checks that each desktop build starts and answers, then publishes
# the files as a release of this repository. The website's download
# buttons link to .../releases/latest/download/<file>, so the file names
# must not change.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to build, e.g. v0.1.0"
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # v1.0.0-rc.1: a release candidate. It is published as a pre-release, which
  # GitHub's /releases/latest (the website's download buttons, the desktop
  # app's update check, the server set-up) leaves out, and the server image
  # gets no :latest tag. Try it, then tag the release itself.
  PRERELEASE: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14            # Apple silicon
            assets: BioManager-macOS-AppleSilicon.zip
          - os: macos-15-intel
            assets: BioManager-macOS-Intel.zip
          - os: windows-latest
            assets: BioManager-Windows.zip
          # The oldest supported Ubuntu, so the build's glibc suits most distributions.
          - os: ubuntu-22.04
            assets: BioManager-Linux.AppImage BioManager-Linux.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Only to decide whether to sign (a step's `if` can't read secrets).
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libegl1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2 libfuse2
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          # Linux has no system web view pywebview can rely on; bundle Qt's.
          if [ "$RUNNER_OS" = "Linux" ]; then python -m pip install "pywebview[qt]==5.4"; fi

      # This runner has WebView2 and .NET, as Windows 11 does. If the check that
      # sends a Windows 10 PC without them to the web browser (desktop_windows.py)
      # can't find them here, it would do that to every Windows user.
      - name: The window's parts are found (Windows)
        if: runner.os == 'Windows'
        run: python -c "import sys, desktop_windows as d; r = d.missing(); print('missing:', r); sys.exit(1 if r else 0)"

      - name: Build
        run: BIOMANAGER_VERSION="${TAG#v}" ./scripts/build-desktop.sh

      # Signed and notarised when the lab's Apple developer account is set up
      # (secrets, see scripts/sign-macos.sh); otherwise unsigned, as before.
      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/sign-macos.sh
      # Signed with the lab's code-signing certificate when there is one:
      # WINDOWS_CERT_PFX (the .pfx, base64) and WINDOWS_CERT_PASSWORD.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist/BioManager/BioManager.exe
          & $signtool.FullName verify /pa dist/BioManager/BioManager.exe
          Remove-Item $pfx

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the bundle's symlinks and permissions, which zip does not.
        run: ditto -c -k --keepParent dist/BioManager.app "${{ matrix.assets }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BioManager -DestinationPath "${{ matrix.assets }}"
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -C dist -czf BioManager-Linux.tar.gz BioManager
          # AppImage: one file people mark executable and double-click.
          APPDIR="$RUNNER_TEMP/BioManager.AppDir"
          mkdir -p "$APPDIR/usr/lib"
          cp -a dist/BioManager "$APPDIR/usr/lib/BioManager"
          cp desktop/BioManager.png "$APPDIR/biomanager.png"
          cat > "$APPDIR/biomanager.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=BioManager
          Comment=Lab colony, stock and inventory management
          Exec=BioManager
          Icon=biomanager
          Categories=Science;Biology;Office;
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/BioManager/BioManager" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" BioManager-Linux.AppImage

      # Start what was just built, on a scratch data folder, and ask it for a page.
      - name: Check the app starts
        env:
          BIOMANAGER_DATA_DIR: ${{ runner.temp }}/smoke-data
          BIOMANAGER_PORT: "5099"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          case "$RUNNER_OS" in
            macOS)   dist/BioManager.app/Contents/MacOS/BioManager > smoke.log 2>&1 & ;;
            Windows) dist/BioManager/BioManager.exe > smoke.log 2>&1 & ;;
            Linux)   xvfb-run -a ./BioManager-Linux.AppImage > smoke.log 2>&1 & ;;
          esac
          for i in $(seq 90); do
            if curl -fsS -o /dev/null http://127.0.0.1:5099/register; then echo "the app answered"; exit 0; fi
            sleep 2
          done
          echo "the app never answered"; cat smoke.log; exit 1

      # The AppImage on a bare Ubuntu, with none of the libraries the window
      # needs: it must open in the browser and keep answering, not stop with a
      # traceback (scripts/bare-linux-check.sh, desktop_linux.py).
      - name: Check the app on a bare machine (Linux)
        if: runner.os == 'Linux'
        run: scripts/bare-linux-check.sh BioManager-Linux.AppImage

      # Calendar → Mac Calendar in what was just built, on a demo lab: the
      # Mac's calendars are allowed to it as if Allow were clicked, and it
      # must fill a BioManager calendar in On My Mac and take it away again
      # (scripts/mac-calendar-check/in-the-app.py).
      - name: Check the Mac Calendar
        if: runner.os == 'macOS'
        env:
          BIOMANAGER_PORT: "5098"
          PORT: "5098"
          DATA: ${{ runner.temp }}/calendar-demo
        run: |
          python scripts/demo-data.py "$DATA" | tail -1
          APP="$PWD/dist/BioManager.app"
          PY=$(python -c 'import os, sys; print(os.path.realpath(sys.executable))')
          sudo /usr/bin/python3 scripts/mac-calendar-check/grant.py bundle:org.biomanager.desktop \
            "$APP/Contents/MacOS/BioManager" "$PY" $(scripts/mac-calendar-check/chain.sh) /bin/bash
          BIOMANAGER_DATA_DIR="$DATA" DATABASE_URL="sqlite:///$DATA/biomanager.db" \
            "$APP/Contents/MacOS/BioManager" > calendar.log 2>&1 &
          for i in $(seq 90); do curl -fsS -o /dev/null "http://127.0.0.1:$PORT/login" && break; sleep 2; done
          python scripts/mac-calendar-check/in-the-app.py || { cat calendar.log; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: BioManager-*.*
          if-no-files-found: error

  # The lab server, without the source: the app as an image for Intel and ARM
  # machines (Oracle's free VMs are ARM), and the deploy files as a bundle
  # that runs it (scripts/make-server-bundle.sh). The image goes into the
  # release as a file per architecture, which the bundle's host/load-image.sh
  # downloads and loads, so no registry is needed. It is also pushed to
  # ghcr.io/gaspolymerase/biomanager, for whoever can pull from there.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gaspolymerase/biomanager
    steps:
      - uses: actions/checkout@v7
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: BIOMANAGER_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.PRERELEASE != 'true' && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=BioManager
            org.opencontainers.image.description=BioManager lab server (see biomanager-server.tar.gz in the release)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://biomanager.org/server.html

      # The same image as files for the release; the layers come from the build's cache.
      - name: Image files
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" -t "$IMAGE:$VERSION" --build-arg BIOMANAGER_VERSION="$VERSION" \
              --output "type=docker,dest=biomanager-image-$arch.tar" .
            gzip -9 "biomanager-image-$arch.tar"
          done
          ls -la biomanager-image-*.tar.gz

      - name: Server bundle
        run: scripts/make-server-bundle.sh "$VERSION" biomanager-server.tar.gz

      # Start the bundle as a lab would, from the release's image file with no
      # registry login at all, and ask it for a page.
      - name: Check the bundle runs
        run: |
          docker logout ghcr.io
          docker image rm -f "$IMAGE:$VERSION" 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/server" && tar -xzf biomanager-server.tar.gz -C "$RUNNER_TEMP/server"
          cd "$RUNNER_TEMP/server/Biomanager/deploy"
          host/load-image.sh "$GITHUB_WORKSPACE/biomanager-image-amd64.tar.gz"
          cp .env.example .env
          sed -i "s|^DOMAIN=.*|DOMAIN=localhost|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" .env
          docker compose up -d || { docker compose ps; docker compose logs; exit 1; }
          for i in $(seq 60); do
            if curl -fsSk -o /dev/null https://localhost/healthz && curl -fsSk -o /dev/null https://localhost/register; then
              echo "the bundled server answered"; docker compose down -v; exit 0
            fi
            sleep 5
          done
          docker compose ps; docker compose logs; exit 1

      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: |
            biomanager-server.tar.gz
            biomanager-image-amd64.tar.gz
            biomanager-image-arm64.tar.gz
          if-no-files-found: error
          compression-level: 0

  android:
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  publish:
    needs: [desktop, android, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # What's new in this version, written for the labs (docs/release-notes/<version>.md),
      # and the plugin for AI assistants, zipped by its script (standard library only).
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            docs/release-notes
            plugins/biomanager
            scripts/assistant-packages.py
            app/__init__.py
            app/assistant_tools.py
            app/static/icon.svg
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: "{desktop-*,BioManager-Android.apk,server-bundle}"
          merge-multiple: true
      - name: The plugin for AI assistants
        run: python3 scripts/assistant-packages.py --zips assets
      - run: ls -la assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          **Download** the file for your device below, or from the [website](https://biomanager.org/#download).

          | File | For |
          | --- | --- |
          | `BioManager-macOS-AppleSilicon.zip` | Macs with an M1 or later chip |
          | `BioManager-macOS-Intel.zip` | Macs with an Intel chip |
          | `BioManager-Windows.zip` | Windows 10 and 11, 64-bit |
          | `BioManager-Linux.AppImage` | Linux, x86-64: mark it executable and open it |
          | `BioManager-Linux.tar.gz` | Linux, the same app as a folder |
          | `BioManager-Android.apk` | Android 7 and later: connects to your lab's BioManager server |
          | `biomanager-server.tar.gz` | A lab server: the deploy files. [How to set one up](https://biomanager.org/server.html) |
          | `biomanager-image-amd64.tar.gz` | The lab server's app for Intel/AMD machines, loaded by the bundle's `host/load-image.sh` |
          | `biomanager-image-arm64.tar.gz` | The same for ARM machines, such as Oracle Cloud's free Ampere VMs |
          | `BioManager-plugin-Claude.zip` | The plugin that teaches Claude to work with BioManager: Customize → Plugins → Add → Upload plugin. [Connecting an assistant](https://biomanager.org/guide/connect-an-ai-assistant) |
          | `BioManager-plugin-ChatGPT.zip` | The same for ChatGPT, to upload at platform.openai.com/plugins and share with your lab |
          | `BioManager-plugin-Kimi.zip` | The same for Kimi Code: `/plugins install` with this file's link |

          **First launch:** on a Mac, right-click BioManager and choose **Open**; on Windows, choose **More info → Run anyway**. The apps are not signed by Apple or Microsoft, so the system asks once. On Android, allow your browser to install apps when asked.

          Your data is kept outside the app, so updating never touches it.
          EOF
          # A candidate (1.0.0-rc.1) uses its release's notes.
          written="docs/release-notes/$(echo "${TAG#v}" | sed 's/-.*//').md"
          if [ -f "$written" ]; then
            { cat "$written"; echo; echo "---"; echo; cat notes.md; } > notes.full.md && mv notes.full.md notes.md
          fi
          publish() {
            # A release made by hand first (or a re-run) gets its files replaced.
            pre=()
            [ "$PRERELEASE" = "true" ] && pre=(--prerelease)
            if gh release view "$TAG" --repo "$1" > /dev/null 2>&1; then
              gh release upload "$TAG" assets/* --repo "$1" --clobber
              gh release edit "$TAG" --repo "$1" --notes-file notes.md "${pre[@]}"
            else
              gh release create "$TAG" assets/* --repo "$1" --title "BioManager ${TAG#v}" --notes-file notes.md "${pre[@]}"
            fi
          }
          publish "$GITHUB_REPOSITORY"
