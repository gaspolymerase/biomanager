# Added on top of compose.yaml when the server is reached over Tailscale and
# TLS=tailscale: Caddy asks the host's tailscaled for the *.ts.net
# certificate (and its renewals) through the daemon's local socket.
# The folder, not the socket: tailscaled makes a new socket each time it
# restarts, which a mounted file would never see (host/install.sh keeps the
# folder itself across restarts).
#
# Turn it on in .env, so plain `docker compose` commands keep working:
#   COMPOSE_FILE=compose.yaml:compose.tailscale.yaml
services:
  caddy:
    volumes:
      - /var/run/tailscale:/var/run/tailscale
